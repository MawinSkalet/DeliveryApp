name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  orders-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait api
      - run: docker compose exec -T api python -m scripts.seed
      - run: docker compose exec -T api python -m scripts.verify_seed
      - run: docker compose exec -T api python -m unittest discover -s tests -p "test_*.py"
      - run: docker compose exec -T api python -m scripts.smoke_cp1
      - run: docker compose exec -T api python -m scripts.smoke_orders
      - if: always()
        run: docker compose down -v
